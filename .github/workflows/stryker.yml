# Stryker 变异测试：PR 触发，对变更的 lib/ 与 supabase/ 源文件中「有测试」的定向跑。
# 不发 PR 评论：结果在 job 日志中查看，同时上传报告 artifact 便于排查。
name: Stryker Mutation Testing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 计算变异范围：白名单策略——只跑 PR 变更的 lib/ 与 supabase/ 中「有测试」且「在 stryker.config.json mutate 白名单内」的源文件。
      # 白名单以 stryker.config.json 的 mutate 数组为准（与本地 pnpm test:stryker 口径一致），
      # 静态内容为主的源文件（如 prompt.ts 的提示词文案表）不在白名单内，不纳入变异，避免门禁被内容串拖垮
      - name: Compute mutation scope
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            // 分页拉全变更文件：listFiles 默认每页 30，大 PR 会漏掉后面的文件
            const fs = require('fs')
            const config = JSON.parse(fs.readFileSync('stryker.config.json', 'utf8'))
            const whitelist = new Set(config.mutate)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            })
            // 白名单：仅当存在同名测试文件时该源文件才纳入变异
            const isTested = (f) =>
              ['.test.ts', '.test.tsx'].some((ext) => fs.existsSync(f.replace(/\.ts$/, ext)))
            const sources = files
              .map((f) => f.filename)
              .filter(
                (f) =>
                  (f.startsWith('lib/') || f.startsWith('supabase/')) &&
                  f.endsWith('.ts') &&
                  !f.includes('.test.') &&
                  !f.endsWith('.d.ts') &&
                  whitelist.has(f) &&
                  isTested(f)
              )
            core.setOutput('mode', sources.length === 0 ? 'skip' : 'scoped')
            core.setOutput('args', sources.map((f) => `--mutate "${f}"`).join(' '))
            core.setOutput('fileCount', String(sources.length))

      - name: Run mutation tests (changed files)
        if: steps.scope.outputs.mode == 'scoped'
        run: pnpm test:stryker ${{ steps.scope.outputs.args }}

      - name: Skip mutation tests
        if: steps.scope.outputs.mode == 'skip'
        run: echo "No lib/ source files changed in this PR; skipping mutation tests"

      # 不单独发 PR 评论，结果以日志形式查看；变异失败（低于阈值）也上传报告便于排查
      - name: Upload Stryker report
        if: always() && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/stryker
          retention-days: 7
