# 每日天气定时采集：GitHub Actions 直接执行采集管道并写入 Supabase，
# 不再依赖部署环境与 /api/cron/weather 路由。
# 城市全为 Asia/Tokyo，「每日 0 点」取 JST 午夜 = 15:00 UTC（'0 15 * * *'）。
name: Weather Cron

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {} # 支持手动触发，便于联调（Actions → Run workflow）

permissions:
  contents: read

jobs:
  weather-cron:
    name: 每日天气采集
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 从 GitHub Secrets 注入，变量名与 .env.example 保持一致；
      # SUPABASE_SERVICE_ROLE_KEY 为服务端密钥，仅存于 repo secrets，勿暴露到客户端
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 直跑采集管道：写库后按运行终态退出，全失败（succeeded=0）退出非零标红；
      # 部分成功仍算已执行（绿但日志可见各格错误），比旧 route 恒 200 失败可见性更好
      - name: Run weather pipeline
        run: pnpm tsx scripts/weather-cron.ts
