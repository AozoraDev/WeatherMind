# 变异测试：PR 上对变更的 lib/ 文件定向跑 Stryker 并评论结果（评分低于 break 阈值时
# 同样会评论，CI 仍标红）；
# main 推送 / 每晚定时 / 手动触发时全量跑，产出 html 报告供下载
name: Mutation Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每日 03:23 UTC 跑一次，避开整点尖峰
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # 需要给 PR 发评论（github-script 用 issue comments 接口）
  pull-requests: write
  issues: write

jobs:
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 计算变异范围：PR 只跑变更的 lib/ 源文件（快速且相关），
      # 非 PR 事件全量跑；PR 未改动源文件则跳过
      - name: Compute mutation scope
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number
            if (!prNumber) {
              core.setOutput('mode', 'full')
              return
            }
            // 逐页拉取全部变更文件：listFiles 默认每页 30，大 PR 会漏掉后面的 lib/ 文件
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            })
            const sources = files
              .map(f => f.filename)
              .filter(f => f.startsWith('lib/') && f.endsWith('.ts') && !f.includes('.test.') && !f.endsWith('.d.ts'))
            if (sources.length === 0) {
              core.setOutput('mode', 'skip')
              return
            }
            core.setOutput('mode', 'scoped')
            core.setOutput('args', sources.map(f => `--mutate "${f}"`).join(' '))

      - name: Run mutation tests (changed files)
        if: steps.scope.outputs.mode == 'scoped'
        run: pnpm test:mutation ${{ steps.scope.outputs.args }}

      - name: Run mutation tests (full)
        if: steps.scope.outputs.mode == 'full'
        run: pnpm test:mutation

      - name: Skip mutation tests
        if: steps.scope.outputs.mode == 'skip'
        run: echo "PR 未改动 lib/ 源文件，跳过变异测试"

      # 用 always() 保证变异低于 break 阈值（Stryker 退出码非 0、上一步失败）时
      # 也能发评论：Stryker 会在退出前先写出 JSON 报告，评分/存活明细都还读得到
      - name: Comment mutation result on PR
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.mode != 'skip'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const reportPath = 'reports/mutation/mutation-report.json'
            if (!fs.existsSync(reportPath)) {
              console.log('未找到变异报告，跳过评论')
              return
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            const fileEntries = Object.entries(report.files)

            // 逐文件统计变异状态，收集存活变异体的位置（中英双语各一份）
            const totals = { Killed: 0, Survived: 0, NoCoverage: 0, Timeout: 0, CompileError: 0, RuntimeError: 0 }
            const rows = []
            const rowsEn = []
            const survivedList = []
            const survivedListEn = []
            for (const [file, f] of fileEntries) {
              const per = { Killed: 0, Survived: 0, NoCoverage: 0, Timeout: 0, CompileError: 0, RuntimeError: 0 }
              for (const m of f.mutants) {
                per[m.status] = (per[m.status] || 0) + 1
                totals[m.status] = (totals[m.status] || 0) + 1
                if (m.status === 'Survived') {
                  survivedList.push(`- \`${file}:${m.location.start.line}\` **${m.mutatorName}**：变异未被测试杀死`)
                  survivedListEn.push(`- \`${file}:${m.location.start.line}\` **${m.mutatorName}**: mutation not killed by tests`)
                }
              }
              const total = f.mutants.length
              const killed = per.Killed
              const score = total ? ((killed / total) * 100).toFixed(1) : '100.0'
              rows.push(`| \`${file}\` | ${score}% | ${killed} | ${per.Survived} | ${per.NoCoverage} |`)
              rowsEn.push(`| \`${file}\` | ${score}% | ${killed} | ${per.Survived} | ${per.NoCoverage} |`)
            }

            const total = Object.values(totals).reduce((a, b) => a + b, 0)
            const killed = totals.Killed
            const score = total ? ((killed / total) * 100).toFixed(1) : '100.0'

            // 中文版
            let body = [
              `## 🧬 变异测试结果（MR ${score}%）`,
              '',
              `**${killed}/${total} 个变异体被杀死** · 存活 ${totals.Survived} · 未覆盖 ${totals.NoCoverage}`,
              '',
              '> 本次对 PR 变更的 lib/ 源文件做定向变异。',
              '',
              '| 文件 | 分数 | 杀死 | 存活 | 未覆盖 |',
              '|---|---|---|---|---|',
              ...rows,
            ].join('\n')
            if (survivedList.length > 0) {
              body += `\n\n<details>\n<summary>存活变异体明细（${survivedList.length}）</summary>\n\n${survivedList.join('\n')}\n</details>`
            }

            // 英文版（追加在中文下方）
            body += [
              '',
              '---',
              '',
              `## 🧬 Mutation Test Result (MR ${score}%)`,
              '',
              `**${killed}/${total} mutants killed** · ${totals.Survived} survived · ${totals.NoCoverage} no coverage`,
              '',
              '> Scoped to lib/ source files changed in this PR.',
              '',
              '| File | Score | Killed | Survived | No Coverage |',
              '|---|---|---|---|---|',
              ...rowsEn,
            ].join('\n')
            if (survivedListEn.length > 0) {
              body += `\n\n<details>\n<summary>Survived mutants (${survivedListEn.length})</summary>\n\n${survivedListEn.join('\n')}\n</details>`
            }
            const marker = '<!-- weathermind-stryker-report -->'
            body += `\n\n${marker}`

            // 已有该标记的评论则更新，避免每个 commit 都刷一条。
            // fork 来的 PR 无评论权限，try/catch 兜底不阻塞 job
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.find(c => c.body && c.body.includes(marker))
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
                console.log('已更新变异测试评论')
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                })
                console.log('已新建变异测试评论')
              }
            } catch (err) {
              console.log(`评论失败（可能是 fork PR 无权限）：${err.message}`)
            }

      # 变异失败（低于阈值）也上传报告，方便在失败时排查
      - name: Upload mutation report
        if: always() && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7
