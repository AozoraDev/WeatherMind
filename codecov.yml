# Codecov 配置：PR 评论 + 项目级覆盖率检查
# 覆盖率由 .github/workflows/ci.yml 的 codecov-action@v5 上传
# 注意：仓库根目录只保留这一个 codecov 配置文件（codecov.yml，不带点，服务端读取最稳）
coverage:
  status:
    project:
      default:
        # 目标取基准分支实际覆盖率，防止 PR 拉低整体覆盖率
        target: auto
        # 允许 ±1% 波动，避免统计噪音误红
        threshold: 1%
        # 只统计业务逻辑，与 vitest.config.ts 的 include（lib/**、supabase/**）一致
        paths:
          - lib/
          - supabase/
    patch:
      default:
        # 本次改动新增/修改代码行的覆盖率目标
        target: auto
        threshold: 1%

# PR 评论：顶部汇总 + diff 覆盖率 + 文件明细
comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  hide_project_coverage: false

# 无需统计的路径（已在 vitest.config.ts include 排除，此处兜底）
ignore:
  - "app/**"
  - "components/ui/**"
  - "i18n/**"
