# Codecov 配置：PR 评论 + 项目级覆盖率检查
# 覆盖率由 .github/workflows/ci.yml 的 codecov-action@v5（OIDC）上传
coverage:
  status:
    project:
      default:
        # 目标取基准分支实际覆盖率，防止 PR 拉低整体覆盖率
        # 当前整体覆盖率约 36%，先用 auto 守底；稳定后可改固定值（如 60%）
        target: auto
        # 允许 ±1% 波动，避免统计噪音误红
        threshold: 1%
        # 只统计业务逻辑，与 vitest.config.ts 的 include（lib/**、supabase/**）一致
        paths:
          - lib/
          - supabase/
    patch:
      default:
        # 本次改动新增/修改代码行的覆盖率目标
        target: auto
        threshold: 1%

# PR 评论：顶部汇总 + diff 覆盖率 + 文件明细
comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  hide_project_coverage: false
